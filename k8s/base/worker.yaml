apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybrid-rag-worker
  namespace: hybrid-rag
  labels:
    app: hybrid-rag-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hybrid-rag-worker
  template:
    metadata:
      labels:
        app: hybrid-rag-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/org/hybrid-rag-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hybrid-rag-config
            - secretRef:
                name: hybrid-rag-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hybrid-rag-worker-hpa
  namespace: hybrid-rag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hybrid-rag-worker
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
